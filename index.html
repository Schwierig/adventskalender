<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adventskalender zum Hören</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,600..900,100&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --tanne: #17392B;
    --tanne-tief: #0E2419;
    --beere: #A8233A;
    --gold: #D9A441;
    --schnee: #EEF3EF;
    --moos: #3E6B4F;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --text: "Nunito", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --spalten: 6;
    --zeilen: 4;
    --zelle: 100px;
    --abstand: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--text);
    color: var(--schnee);
    background-color: var(--tanne);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(238,243,239,.10) 1.5px, transparent 2px),
      radial-gradient(circle at 70% 80%, rgba(238,243,239,.07) 1px, transparent 1.5px);
    background-size: 90px 90px, 55px 55px;
    -webkit-tap-highlight-color: transparent;
  }

  .seite {
    height: 100vh;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    padding: clamp(8px, 2.2vmin, 22px);
    gap: clamp(6px, 1.6vmin, 16px);
  }

  header {
    flex: none;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 4px 16px;
  }
  h1 {
    font-family: var(--display);
    font-variation-settings: "SOFT" 100, "opsz" 144;
    font-weight: 900;
    font-size: clamp(1.3rem, 5vmin, 3rem);
    line-height: 1;
    margin: 0;
  }
  .status { margin: 0; font-weight: 800; color: var(--gold); font-size: clamp(.8rem, 2.2vmin, 1.05rem); }

  .kalender {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(var(--spalten), 1fr);
    grid-template-rows: repeat(var(--zeilen), minmax(48px, 1fr));
    gap: var(--abstand);
  }

  .tuer {
    position: relative;
    border: 0; padding: 0; background: none;
    cursor: pointer;
    perspective: 900px;
    font: inherit; color: inherit;
    border-radius: 8px;
    min-width: 0; min-height: 0;
  }
  .tuer:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .innen {
    position: absolute; inset: 0;
    border-radius: 8px;
    background: var(--tanne-tief);
    box-shadow: inset 0 3px 12px rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
  }
  .innen svg { width: calc(var(--zelle) * .5); height: calc(var(--zelle) * .5); }

  .blatt {
    position: absolute; inset: 0;
    border-radius: 8px;
    transform-origin: left center;
    transition: transform .7s cubic-bezier(.3,.9,.3,1.05);
    display: flex; align-items: flex-end;
    padding: calc(var(--zelle) * .06) calc(var(--zelle) * .1);
    backface-visibility: hidden;
    border: 2px solid rgba(255,255,255,.14);
  }
  .blatt .zahl {
    font-family: var(--display);
    font-variation-settings: "SOFT" 100, "opsz" 144;
    font-weight: 800;
    font-size: calc(var(--zelle) * .44);
    line-height: 1;
  }
  .farbe-0 .blatt { background: var(--beere); color: var(--schnee); }
  .farbe-1 .blatt { background: var(--moos); color: var(--schnee); }
  .farbe-2 .blatt { background: var(--gold); color: var(--tanne-tief); }
  .farbe-3 .blatt { background: var(--schnee); color: var(--beere); }
  .tuer.tag24 .blatt .zahl { font-weight: 900; }
  .tuer.tag24 .blatt::before {
    content: "★";
    position: absolute; top: 6%; right: 9%;
    font-size: calc(var(--zelle) * .22);
  }
  .tuer.gesperrt .blatt::after {
    content: "";
    position: absolute; bottom: 10%; right: 9%;
    width: calc(var(--zelle) * .09); height: calc(var(--zelle) * .09);
    min-width: 7px; min-height: 7px;
    border-radius: 50%;
    border: 2px solid currentColor; opacity: .45;
  }
  .tuer.heute .blatt { box-shadow: 0 0 0 3px var(--gold), 0 0 22px rgba(217,164,65,.55); }
  .tuer.offen .blatt { transform: rotateY(-108deg); pointer-events: none; }

  footer {
    flex: none;
    font-size: clamp(.75rem, 1.9vmin, .95rem);
    opacity: .8;
  }
  footer button {
    color: inherit; font: inherit; background: none; border: 0; padding: 2px 0;
    text-decoration: underline; cursor: pointer;
  }

  .toast {
    position: fixed; left: 50%; bottom: 14px;
    transform: translate(-50%, 16px);
    background: var(--schnee); color: var(--tanne-tief);
    font-weight: 800; padding: 10px 16px; border-radius: 30px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
    max-width: 92vw; text-align: center;
    z-index: 30;
  }
  .toast.zeigen { opacity: 1; transform: translate(-50%, 0); }

  /* Türchen-Fenster */
  .schleier {
    position: fixed; inset: 0;
    background: rgba(14,36,25,.75);
    display: flex; align-items: center; justify-content: center;
    padding: 8px;
    opacity: 0; visibility: hidden;
    transition: opacity .2s, visibility .2s;
    z-index: 20;
  }
  .schleier.offen { opacity: 1; visibility: visible; }
  .fenster {
    width: min(600px, 100%);
    max-height: 100%;
    overflow-y: auto;
    background: var(--schnee); color: var(--tanne-tief);
    border-radius: 16px;
    padding: clamp(16px, 4vmin, 30px);
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    border-top: 7px solid var(--beere);
  }
  .fenster h2 {
    font-family: var(--text);
    font-weight: 800; font-size: clamp(1rem, 2.6vmin, 1.15rem);
    color: var(--beere);
    margin: 0 0 10px;
  }
  .raetsel {
    font-family: var(--display);
    font-variation-settings: "SOFT" 100, "opsz" 72;
    font-weight: 600;
    font-size: clamp(1.25rem, 4vmin, 1.9rem);
    line-height: 1.3;
    margin: 0 0 clamp(16px, 3.5vmin, 26px);
    white-space: pre-line;
  }
  .knopf {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%;
    min-height: 58px; padding: 12px 18px;
    border-radius: 14px; border: 0;
    background: var(--tanne); color: var(--schnee);
    font: inherit; font-weight: 800; font-size: clamp(1.05rem, 3vmin, 1.2rem);
    text-decoration: none; cursor: pointer;
  }
  .knopf:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .knopf svg { width: 20px; height: 20px; flex: none; }
  .knopf.leer { background: #c9d3cc; color: var(--tanne); cursor: default; }
  .schliessen {
    display: block; margin: 12px auto 0;
    background: none; border: 0; font: inherit; font-weight: 700;
    color: var(--tanne); text-decoration: underline; cursor: pointer; padding: 8px 12px;
  }

  @media (prefers-reduced-motion: reduce) {
    .blatt, .toast, .schleier { transition: none; }
  }
</style>
</head>
<body>
<div class="seite">

  <header>
    <h1>Adventskalender zum Hören</h1>
    <p class="status" id="status"></p>
  </header>

  <main class="kalender" id="kalender" aria-label="Türchen 1 bis 24"></main>

  <footer>
    <button type="button" id="zuruecksetzen">Alle Türchen wieder schließen</button>
  </footer>

  <div class="schleier" id="schleier" aria-hidden="true">
    <div class="fenster" role="dialog" aria-modal="true" aria-labelledby="fensterTitel">
      <h2 id="fensterTitel">Türchen 1</h2>
      <p class="raetsel" id="raetsel"></p>
      <a class="knopf" id="btnAbspielen" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M5 3l12 7-12 7z"/></svg>
        <span id="btnText">Lied in Spotify abspielen</span>
      </a>
      <button type="button" class="schliessen" id="btnSchliessen">Türchen schließen</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
</div>

<script>

/* true = alle Türchen sofort öffenbar (zum Testen). Vor dem 1.12. wieder auf false! */
const TESTMODUS = true;

/* ========================================================= */
const REIHENFOLGE = [7,19,3,24,12,1,16,9,21,5,14,22,2,18,10,6,23,13,4,20,11,17,8,15];
const FARBEN = [0,1,2,3,1,0,3,2,0,2,1,3,2,0,1,3,0,3,2,1,3,1,0,2];
const SPEICHER_KEY = "hoer-adventskalender-offen";
const STANDARD_RAETSEL = "Welches Lied ist das?";

const $ = id => document.getElementById(id);
const heute = new Date();
const imDezember = heute.getMonth() === 11;
const heuteTag = heute.getDate();
const istOeffenbar = tag => TESTMODUS || (imDezember && tag <= heuteTag);

function trackId(eingabe) {
  if (!eingabe) return null;
  const s = String(eingabe).trim();
  const m = s.match(/track[\/:]([A-Za-z0-9]{22})/);
  if (m) return m[1];
  return /^[A-Za-z0-9]{22}$/.test(s) ? s : null;
}

function ladeOffene() {
  try { return new Set(JSON.parse(localStorage.getItem(SPEICHER_KEY) || "[]")); }
  catch (e) { return new Set(); }
}
function speichereOffene() {
  try { localStorage.setItem(SPEICHER_KEY, JSON.stringify([...offene])); } catch (e) {}
}
let offene = ladeOffene();

function statusText() {
  if (TESTMODUS) return "Testmodus: alle Türchen offen";
  if (imDezember && heuteTag <= 24) return "Heute ist Türchen " + heuteTag + " dran";
  if (imDezember) return "Alle 24 Türchen sind offen";
  const start = new Date(heute.getFullYear(), 11, 1);
  const tage = Math.round((start - new Date(heute.getFullYear(), heute.getMonth(), heute.getDate())) / 86400000);
  return tage === 1 ? "Morgen geht das erste Türchen auf" : "Noch " + tage + " Tage bis zum ersten Türchen";
}
$("status").textContent = statusText();

/* ---------- Raster an Bildschirm anpassen ---------- */
function passeRasterAn() {
  const k = $("kalender");
  const W = k.clientWidth, H = k.clientHeight;
  const abstand = Math.max(5, Math.min(12, Math.round(Math.min(W, H) / 60)));
  let beste = { s: 6, z: 4, zelle: 0 };
  [3, 4, 6, 8, 12].forEach(s => {
    const z = 24 / s;
    const zelle = Math.min((W - abstand * (s - 1)) / s, (H - abstand * (z - 1)) / z);
    if (zelle > beste.zelle) beste = { s, z, zelle };
  });
  const r = document.documentElement.style;
  r.setProperty("--spalten", beste.s);
  r.setProperty("--zeilen", beste.z);
  r.setProperty("--abstand", abstand + "px");
  r.setProperty("--zelle", Math.max(48, beste.zelle) + "px");
}

const plattenSVG = '<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#0E2419" stroke="#D9A441" stroke-width="3"/><circle cx="32" cy="32" r="20" fill="none" stroke="#3E6B4F" stroke-width="1.5"/><circle cx="32" cy="32" r="13" fill="none" stroke="#3E6B4F" stroke-width="1.5"/><circle cx="32" cy="32" r="6" fill="#A8233A"/><circle cx="32" cy="32" r="1.8" fill="#EEF3EF"/></svg>';

function baueKalender() {
  const k = $("kalender");
  k.innerHTML = "";
  REIHENFOLGE.forEach((tag, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tuer farbe-" + FARBEN[i] + " tag" + tag;
    if (!istOeffenbar(tag)) b.classList.add("gesperrt");
    if (imDezember && tag === heuteTag && !TESTMODUS) b.classList.add("heute");
    if (offene.has(tag) && istOeffenbar(tag)) b.classList.add("offen");
    b.dataset.tag = tag;
    b.setAttribute("aria-label", "Türchen " + tag + (istOeffenbar(tag) ? "" : ", noch verschlossen"));
    b.innerHTML = '<span class="innen">' + plattenSVG + '</span><span class="blatt"><span class="zahl">' + tag + '</span></span>';
    b.addEventListener("click", () => tuerGeklickt(tag, b));
    k.appendChild(b);
  });
}

let toastTimer;
function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("zeigen");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("zeigen"), 2600);
}

function tuerGeklickt(tag, el) {
  if (!istOeffenbar(tag)) {
    if (imDezember) {
      const rest = tag - heuteTag;
      toast("Türchen " + tag + " geht erst in " + rest + (rest === 1 ? " Tag" : " Tagen") + " auf.");
    } else {
      toast("Türchen " + tag + " geht am " + tag + ". Dezember auf.");
    }
    return;
  }
  const warOffen = el.classList.contains("offen");
  el.classList.add("offen");
  offene.add(tag); speichereOffene();
  const warten = (warOffen || matchMedia("(prefers-reduced-motion: reduce)").matches) ? 0 : 550;
  setTimeout(() => oeffneFenster(tag), warten);
}

/* ---------- Fenster ---------- */
let aktuellerTag = null;

function oeffneFenster(tag) {
  aktuellerTag = tag;
  const lied = LIEDER.find(l => l.tag === tag) || {};
  const id = trackId(lied.spotify);
  const knopf = $("btnAbspielen");

  $("fensterTitel").textContent = "Türchen " + tag;
  $("raetsel").textContent = (lied.hinweis && lied.hinweis.trim()) || STANDARD_RAETSEL;

  if (id) {
    // https-Link öffnet auf Tablets mit installierter App direkt Spotify, sonst den Web-Player
    knopf.href = "https://open.spotify.com/track/" + id;
    knopf.classList.remove("leer");
    knopf.removeAttribute("aria-disabled");
    $("btnText").textContent = "Lied in Spotify abspielen";
  } else {
    knopf.removeAttribute("href");
    knopf.classList.add("leer");
    knopf.setAttribute("aria-disabled", "true");
    $("btnText").textContent = "Für dieses Türchen ist noch kein Lied hinterlegt";
  }

  $("schleier").classList.add("offen");
  $("schleier").setAttribute("aria-hidden", "false");
  $("btnSchliessen").focus({ preventScroll: true });
}

function schliesseFenster() {
  $("schleier").classList.remove("offen");
  $("schleier").setAttribute("aria-hidden", "true");
  const t = document.querySelector('.tuer[data-tag="' + aktuellerTag + '"]');
  if (t) t.focus({ preventScroll: true });
}

$("btnSchliessen").addEventListener("click", schliesseFenster);
$("schleier").addEventListener("click", e => { if (e.target === $("schleier")) schliesseFenster(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("schleier").classList.contains("offen")) schliesseFenster(); });

$("zuruecksetzen").addEventListener("click", () => {
  offene = new Set(); speichereOffene(); baueKalender();
  toast("Alle Türchen sind wieder zu.");
});

baueKalender();
passeRasterAn();
window.addEventListener("resize", passeRasterAn);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(passeRasterAn);
</script>
